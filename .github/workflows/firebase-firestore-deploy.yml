name: Deploy Firestore

on:
  push:
    branches:
      - main
    paths:
      - firestore.rules
      - firestore.indexes.json
      - firebase.json
      - .github/workflows/firebase-firestore-deploy.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuelvoice-firestore-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy rules and indexes
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      FIREBASE_PROJECT_ID: bunk-review

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate Firestore configuration
        shell: bash
        run: |
          set -euo pipefail
          test -s firestore.rules
          test -s firestore.indexes.json
          test -s firebase.json
          node -e "const fs=require('fs'); JSON.parse(fs.readFileSync('firestore.indexes.json','utf8')); JSON.parse(fs.readFileSync('firebase.json','utf8'));"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          project_id: ${{ env.FIREBASE_PROJECT_ID }}

      - name: Show Firebase CLI version
        shell: bash
        run: npx --yes firebase-tools@latest --version

      - name: Deploy Firestore rules and indexes
        shell: bash
        run: |
          set -euo pipefail
          npx --yes firebase-tools@latest deploy \
            --project "$FIREBASE_PROJECT_ID" \
            --only "firestore:rules,firestore:indexes" \
            --non-interactive
