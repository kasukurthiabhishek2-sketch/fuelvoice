name: UX Flow Guardrail Search Probe

on:
  push:
    branches: [ux-flow-guardrails-2026-10-06]
    paths:
      - 'live-ux-audit/search-latency-probe.spec.mjs'
      - 'playwright.search-probe.config.ts'
      - '.github/workflows/ux-flow-search-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PRODUCTION_URL: https://fuelvoice.vercel.app
      EXPECTED_PRODUCTION_SHA: e6d41e057e0d29ec798ee010833152d368b9cf44

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install repository dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify production control SHA
        shell: bash
        run: |
          set -euo pipefail
          health="$(curl --fail --silent --show-error --location --max-time 20 "$PRODUCTION_URL/api/health")"
          printf '%s\n' "$health" | jq .
          printf '%s' "$health" | jq -e --arg sha "$EXPECTED_PRODUCTION_SHA" '.status == "ok" and .gitSha == $sha' >/dev/null

      - name: Measure live search completion
        run: npx playwright test --config=playwright.search-probe.config.ts

      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux-flow-search-probe-${{ github.sha }}
          path: live-ux-audit/guardrail-search-probe
          retention-days: 14
          if-no-files-found: warn
