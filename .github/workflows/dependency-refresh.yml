name: Dependency Refresh

on:
  push:
    branches:
      - audit/fix-everything-20261002

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message, '[skip dependency-refresh]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/fix-everything-20261002
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Update patched dependencies and lockfile
        run: |
          node <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.dependencies.next = '^16.3.8';
          pkg.dependencies.dompurify = '^3.4.13';
          pkg.devDependencies['eslint-config-next'] = '^16.3.8';
          pkg.overrides = { ...(pkg.overrides || {}), '@grpc/grpc-js': '1.14.5' };
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          NODE
          npm install --package-lock-only
          npm audit fix --package-lock-only || true
          npm ci
          npm audit --omit=dev --audit-level=high
      - name: Commit refreshed dependency graph
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "Dependency graph already current"
            exit 0
          fi
          git config user.name "FuelVoice CI"
          git config user.email "actions@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "security: upgrade vulnerable dependencies [skip dependency-refresh]"
          git push origin HEAD:audit/fix-everything-20261002
